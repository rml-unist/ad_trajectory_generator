[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trajectory-generator"
version = "1.0.0"
description = "nuPlan reference generation with retiming and short-horizon kinematic QP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robotics and Mobility Lab., UNIST" }]
requires-python = ">=3.9,<3.10"
dependencies = [
    "nuplan-devkit==1.2.2",
    "numpy==1.23.4",
    "scipy==1.13.1",
    "osqp==1.0.5",
    "Shapely==2.0.7",
]

[project.scripts]
trajectory-generator = "trajectory_generation.cli:main"
trajectory-generator-demo = "trajectory_generation.demo:main"

[project.optional-dependencies]
test = ["pytest>=7,<9", "tomli>=2"]
plot = ["matplotlib==3.9.4"]

[dependency-groups]
dev = ["pytest==8.4.2", "tomli>=2", "matplotlib==3.9.4"]

[tool.uv.sources]
nuplan-devkit = { git = "https://github.com/motional/nuplan-devkit.git", rev = "e9241677997dd86bfc0bcd44817ab04fe631405b" }

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_generation"]

[tool.hatch.build.targets.sdist]
include = ["/.gitignore", "/src", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
